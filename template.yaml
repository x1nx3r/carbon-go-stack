apiVersion: manus-dei/v1
name: carbon-go-stack
# Layer 0 pin. Rebuild this after the base entrypoint changes that add the
# template hook and clone-at-commit support.
base: manus-dei/base@sha256:7f6feb3b4aeefbc90aa8e78e8f19b6fe0c6365378a2979a6786c699b24eeb59a
platform: linux/amd64
# The template repository is the sole workspace repository and is cloned at
# the workspace root (ADR-024). Summon resolves its origin and commit; the
# manifest declares no repos list.
workspace: template
toolchain:
  - node@22
  - go@1.25
  - postgresql@18
opencode:
  mode: connect
  model: opencode/glm-5.3-flash
resources:
  cpus: "4"
  memory: 6g
  pids: 1024
secrets:
  # Model provider (OpenCode Zen). Injected at summon, never baked.
  - OPENCODE_API_KEY
