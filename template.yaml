apiVersion: manus-dei/v1
name: carbon-go-stack
# Layer 0 pin. Rebuild this after the base entrypoint changes that add the
# template hook and clone-at-commit support.
base: manus-dei/base@sha256:0e569f125a33788b37d0e0fede12d68d581eb0835d2be6556fcd6c0fc0e90e87
platform: linux/amd64
# The template repository is the sole workspace repository (ADR-022). Summon
# resolves its origin and commit; the manifest declares no repos list.
workspace: template
toolchain:
  - node@22
  - go@1.25
  - postgresql@18
opencode:
  mode: connect
  model: opencode/glm-5.3-flash
resources:
  cpus: "4"
  memory: 6g
  pids: 1024
secrets:
  # Model provider (OpenCode Zen). Injected at summon, never baked.
  - OPENCODE_API_KEY
